[project]
name = "sepsis-early-warning"
version = "0.1.0"
description = "Demo-first sepsis early-warning research project"
requires-python = ">=3.12,<3.15"
dependencies = [
  "flask>=3.1,<4",
  "gunicorn>=23,<24",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "xgboost-cpu>=3.0,<4",
]

[project.optional-dependencies]
research = ["duckdb>=1.1,<2", "mlflow>=3,<4", "optuna>=4,<5", "pyarrow>=18,<20", "shap>=0.46,<1"]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
