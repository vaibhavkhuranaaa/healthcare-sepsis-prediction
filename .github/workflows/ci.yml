name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Verify public boundary
        run: |
          ! git ls-files | grep -Eq '(^|/)(artifacts|mlruns|reports)(/|$)|(^|/)(HANDOFF|STATE)\.md$|\.(parquet|joblib)$'
          ! git ls-files 'data/**' | grep -Ev '^data/(\.gitignore|\.gitkeep)$'
          ! git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$'
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q
      - name: Build container
        run: docker build -f docker/Dockerfile .
